<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AlvaAR PoC</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; background: #111; color: #eee; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 8px 12px; background: #1a1a2e; }
  h1 { margin: 0; font-size: 16px; }
  #stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: 640px; height: auto; background: #000; }
  .panel {
    position: absolute; top: 8px; left: 8px; right: 8px;
    background: rgba(0,0,0,0.6); padding: 8px; border-radius: 6px;
    font-size: 13px; line-height: 1.4;
  }
  .panel .row { display: flex; justify-content: space-between; gap: 8px; }
  .panel .label { color: #aaa; }
  .panel .value { font-variant-numeric: tabular-nums; }
  .status-tracking { color: #6f6; }
  .status-lost { color: #f66; }
  .status-init { color: #fc6; }
  .actions { display: flex; gap: 8px; padding: 12px; background: #1a1a2e; }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .btn-start { background: #2a7; color: #fff; }
  .btn-stop { background: #c44; color: #fff; }
  .btn-reset { background: #346; color: #fff; }
  button:disabled { opacity: 0.5; }
  .log { padding: 8px 12px; background: #000; color: #9c9; font-size: 11px; max-height: 100px; overflow-y: auto; font-family: monospace; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AlvaAR PoC (issue #26)</h1>
  </header>
  <div id="stage">
    <video id="video" playsinline autoplay muted style="display:none"></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="panel">
      <div class="row"><span class="label">状態</span><span id="status" class="value status-init">未起動</span></div>
      <div class="row"><span class="label">FPS</span><span id="fps" class="value">-</span></div>
      <div class="row"><span class="label">pose t (m)</span><span id="pos" class="value">-</span></div>
      <div class="row"><span class="label">累積移動 (m)</span><span id="dist" class="value">0.000</span></div>
      <div class="row"><span class="label">tracking lost 回数</span><span id="lost" class="value">0</span></div>
      <div class="row"><span class="label">フレーム数</span><span id="frames" class="value">0</span></div>
    </div>
  </div>
  <div class="actions">
    <button id="start" class="btn-start">開始</button>
    <button id="stop" class="btn-stop" disabled>停止</button>
    <button id="reset" class="btn-reset">原点リセット</button>
  </div>
  <div id="log" class="log"></div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id)
const log = (msg) => {
  const line = `[${new Date().toLocaleTimeString()}] ${msg}`
  $('log').textContent = `${line}\n${$('log').textContent}`.split('\n').slice(0, 30).join('\n')
  console.log(line)
}

let stream = null
let alva = null
let running = false
let frameCount = 0
let lostCount = 0
let lastPose = null
let originPose = null
let totalDistance = 0
let fpsSamples = []

async function loadAlvaAR() {
  // GitHub Pages 配信のモジュール本体を直接読む (PoC のみ。本統合時は同梱予定)。
  // AlvaAR は内部で WASM を import.meta.url 起点で読み込むため、この URL から
  // 解決される assets/ 配下に WASM が同梱されている前提。
  const url = 'https://alanross.github.io/AlvaAR/examples/public/assets/alva_ar.js'
  log(`AlvaAR 読み込み: ${url}`)
  const mod = await import(/* @vite-ignore */ url)
  if (!mod.AlvaAR) throw new Error('AlvaAR モジュールに AlvaAR エクスポートが見当たらない')
  return mod.AlvaAR
}

async function start() {
  try {
    $('start').disabled = true
    $('status').textContent = '初期化中'
    $('status').className = 'value status-init'

    const AlvaAR = await loadAlvaAR()
    log('AlvaAR ロード成功')

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: 640, height: 480 },
      audio: false,
    })
    $('video').srcObject = stream
    await $('video').play()
    log('カメラ起動成功')

    const canvas = $('canvas')
    canvas.width = 640
    canvas.height = 480
    alva = await AlvaAR.Initialize(canvas.width, canvas.height)
    log(`AlvaAR 初期化完了 (${canvas.width}x${canvas.height})`)

    running = true
    $('stop').disabled = false
    $('status').textContent = 'tracking 待機'
    requestAnimationFrame(loop)
  } catch (err) {
    log(`エラー: ${err.message}`)
    $('status').textContent = 'エラー'
    $('status').className = 'value status-lost'
    $('start').disabled = false
  }
}

function stop() {
  running = false
  if (stream) {
    stream.getTracks().forEach((t) => t.stop())
    stream = null
  }
  $('start').disabled = false
  $('stop').disabled = true
  $('status').textContent = '停止'
  $('status').className = 'value status-init'
  log('停止しました')
}

function resetOrigin() {
  originPose = lastPose ? lastPose.slice() : null
  totalDistance = 0
  log('原点をリセット')
}

let lastFrameTime = performance.now()

function loop() {
  if (!running) return
  const now = performance.now()
  const dt = (now - lastFrameTime) / 1000
  lastFrameTime = now
  fpsSamples.push(dt)
  if (fpsSamples.length > 30) fpsSamples.shift()

  const canvas = $('canvas')
  const ctx = canvas.getContext('2d')
  const video = $('video')
  if (video.readyState >= 2) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height)
    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height)
    frameCount++

    let pose = null
    try {
      pose = alva.findCameraPose(frame)
    } catch (err) {
      log(`findCameraPose 例外: ${err.message}`)
    }

    if (pose) {
      // 列優先 4x4 行列。translation は [12], [13], [14]
      const tx = pose[12], ty = pose[13], tz = pose[14]

      if (lastPose) {
        const dx = tx - lastPose[12]
        const dy = ty - lastPose[13]
        const dz = tz - lastPose[14]
        const step = Math.hypot(dx, dy, dz)
        // 1 フレームで 1m 以上ジャンプは恐らく初期化直後のスパイク。除外
        if (step < 1.0) totalDistance += step
      }
      lastPose = pose.slice()
      if (!originPose) originPose = pose.slice()

      const ox = tx - originPose[12]
      const oy = ty - originPose[13]
      const oz = tz - originPose[14]
      $('pos').textContent = `${ox.toFixed(3)}, ${oy.toFixed(3)}, ${oz.toFixed(3)}`
      $('dist').textContent = totalDistance.toFixed(3)
      $('status').textContent = 'tracking'
      $('status').className = 'value status-tracking'
    } else {
      lostCount++
      $('status').textContent = 'tracking lost'
      $('status').className = 'value status-lost'
    }

    $('frames').textContent = String(frameCount)
    $('lost').textContent = String(lostCount)
    const meanDt = fpsSamples.reduce((a, b) => a + b, 0) / fpsSamples.length
    $('fps').textContent = (1 / meanDt).toFixed(1)
  }

  requestAnimationFrame(loop)
}

$('start').addEventListener('click', start)
$('stop').addEventListener('click', stop)
$('reset').addEventListener('click', resetOrigin)
log('ページ読み込み完了。開始ボタンで起動')
</script>
</body>
</html>
