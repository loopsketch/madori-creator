services:
  nginx:
    image: nginx:alpine
    container_name: madori-nginx
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/ssl:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: nginx -g 'daemon off;'
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./front
      dockerfile: ../docker/front/Dockerfile
    container_name: madori-frontend
    working_dir: /app
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - VITE_API_URL=http://backend:3000
    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c 'npm install && npm run dev'
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: madori-backend
    working_dir: /app
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mysql://root:password@db:3306/madori
      - REDIS_URL=redis://redis:6379
      # セッションストアの選択: 'redis' で永続化、それ以外は in-memory
      - SESSION_STORE=redis
      # 深度推定の選択: 'onnx' (デフォルト、Depth Anything V2 small) | 'mock' (常に固定深度)
      - DEPTH_ESTIMATOR=onnx
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # ONNX モデルファイルの永続化 (起動時にダウンロードしてキャッシュ)
      - backend_models:/app/models
    command: sh -c 'npm install && npm run dev'
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: madori-db
    environment:
      - MYSQL_DATABASE=madori
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: madori-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
  frontend_node_modules:
  backend_node_modules:
  backend_models:
