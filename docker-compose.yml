version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: madori-nginx
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - ./nginx/certs:/etc/nginx/ssl:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    command: nginx -g 'daemon off;'
    depends_on:
      - app

  app:
    image: node:20-alpine
    container_name: madori-app
    working_dir: /app
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:password@db:3306/madori
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./app:/app
    command: sh -c 'apk add --no-cache tzdata && ln -sf /usr/share/zoneinfo/Asia/Tokyo /etc/localtime && npm install && npm run dev -- --host'
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: madori-db
    environment:
      - MYSQL_DATABASE=madori
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: madori-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
