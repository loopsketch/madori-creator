version: '3.8'

services:
  app:
    image: node:20-alpine
    container_name: madori-app
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:password@db:3306/madori
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./app/src:/app/src
      - ./app/package.json:/app/package.json
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: madori-db
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=madori
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: madori-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
