services:
  nginx:
    image: nginx:alpine
    container_name: madori-nginx
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/ssl:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: nginx -g 'daemon off;'
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./front
      dockerfile: ../docker/front/Dockerfile
    container_name: madori-frontend
    working_dir: /app
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - VITE_API_URL=http://backend:3000
    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c 'npm install && npm run dev'
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: madori-backend
    working_dir: /app
    environment:
      - TZ=Asia/Tokyo
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=mysql://root:password@db:3306/madori
      - REDIS_URL=redis://redis:6379
      # セッションストアの選択: 'redis' で永続化、それ以外は in-memory
      - SESSION_STORE=redis
      # 深度推定の選択: 'onnx' (デフォルト、Depth Anything V2 small) | 'mock' (常に固定深度)
      - DEPTH_ESTIMATOR=onnx
      # ONNX Execution Provider の選択: 'auto' (CUDA→CPU フォールバック) | 'cuda' | 'cpu'
      - ONNX_EXECUTION_PROVIDER=auto
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      # ONNX モデルファイルの永続化 (起動時にダウンロードしてキャッシュ)
      - backend_models:/app/models
    command: sh -c 'npm install && npm run dev'
    ports:
      - "3001:3000"
    # GPU を全て割り当て (docker run --gpus all 相当)。
    # 前提: ホストに NVIDIA ドライバ + NVIDIA Container Toolkit が入っていること。
    # backend イメージ側にも CUDA ランタイムが必要 (現状の node:20-slim では CUDA 非対応のため
    # CUDA EP は無効化される。CUDA 利用時は Dockerfile を nvidia/cuda ベースへ切替)。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: madori-db
    environment:
      - MYSQL_DATABASE=madori
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: madori-redis
    ports:
      - "6379:6379"

  # MASt3R-SLAM 推論サーバ (issue #30)
  # Phase 1 (環境構築 + TUM-RGBD 動作確認) は sleep infinity で起動し、
  # `docker compose exec mlserver bash` から手動で checkpoints DL と main.py を実行する。
  # Phase 2 で FastAPI 化したら command を uvicorn 起動に差し替え、port 5001 を backend から呼ぶ。
  mlserver:
    build:
      context: ./docker/mlserver
      dockerfile: Dockerfile
    container_name: madori-mlserver
    # MASt3R-SLAM の multiprocessing が PyTorch shared memory IPC を多用するため、
    # Docker デフォルトの 64MB だと dataloader 初期化付近で Bus error (SIGBUS) が発生する。
    shm_size: '4gb'
    environment:
      - TZ=Asia/Tokyo
      - PYTHONUNBUFFERED=1
      # MASt3R-SLAM 既定。OpenGL を要求する viewer は Docker 内では使わない。
      - HEADLESS=1
    volumes:
      # checkpoints (~2GB) と datasets はイメージに焼かず volume に永続化
      - mlserver_checkpoints:/opt/mast3r-slam/checkpoints
      - mlserver_datasets:/opt/mast3r-slam/datasets
    ports:
      - "5001:5001"
    # GPU 割り当て (backend と同じ要領)。
    # 前提: ホストに NVIDIA ドライバ + NVIDIA Container Toolkit。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Phase 1 の暫定。Phase 2 で uvicorn 起動に切替。
    # 起動後の動作確認手順は docs/mlserver.md を参照。
    profiles:
      - mlserver

volumes:
  mysql_data:
  frontend_node_modules:
  backend_node_modules:
  backend_models:
  mlserver_checkpoints:
  mlserver_datasets:
